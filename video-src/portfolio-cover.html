<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riverside portfolio cover</title>
<style>
  :root { --bg:#0B1D22; --panel:#12282E; --line:#1E3A41; --ink:#ECF5F4; --muted:#9DB6B5; --accent:#2DD4BF; --ok:#34D399; }
  * { box-sizing:border-box; margin:0; }
  body { width:1600px; height:1200px; overflow:hidden; color:var(--ink); font-family:"Segoe UI", Inter, Arial, sans-serif;
    background: radial-gradient(900px 700px at 100% 100%, rgba(45,212,191,.16), transparent 60%),
                radial-gradient(800px 500px at 0% 0%, rgba(52,211,153,.08), transparent 60%), var(--bg); }
  .top { padding:72px 84px 0; }
  .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:22px; }
  h1 { font-size:66px; line-height:1.05; letter-spacing:-.025em; font-weight:800; margin-top:16px; }
  h1 em { font-style:normal; color:var(--accent); }
  .chips { display:flex; gap:14px; margin-top:28px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:12px 22px; font-size:22px; }
  .chip b { color:var(--ok); }
  .stage { position:absolute; left:0; right:0; bottom:0; height:720px; }
  .win { position:absolute; border-radius:14px; overflow:hidden; background:#fff; box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .win .bar { height:30px; background:#1f2a30; display:flex; align-items:center; gap:8px; padding:0 14px; }
  .win .bar i { width:11px; height:11px; border-radius:50%; background:#3b4a51; display:block; }
  .win .bar span { margin-left:12px; color:#9fb3b8; font-size:14px; }
  .win img { display:block; width:100%; }
  .label { position:absolute; background:var(--accent); color:#06282a; font-weight:800; font-size:20px; padding:8px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .site { left:84px; top:70px; width:900px; }
  .admin { right:60px; top:230px; width:700px; }
  .phone { position:absolute; left:610px; top:300px; width:220px; height:400px; border-radius:36px; background:#0d1418; padding:12px; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 2px #2a3a40; }
  .phone div { width:100%; height:100%; border-radius:26px; overflow:hidden; background:#fff; }
  .phone img { width:100%; display:block; }
  .foot { position:absolute; left:84px; bottom:26px; color:var(--muted); font-size:17px; }
</style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">WordPress · clinic website · case study</div>
    <h1>Online booking, reception desk<br>and <em>staff-editable</em> content</h1>
    <div class="chips">
      <div class="chip">PageSpeed <b>100</b></div>
      <div class="chip">Security headers <b>A</b></div>
      <div class="chip">SSL <b>A+</b></div>
      <div class="chip"><b>14/14</b> tests pass</div>
      <div class="chip">No paid plugins</div>
    </div>
  </div>
  <div class="stage">
    <div class="win site"><div class="bar"><i></i><i></i><i></i><span>Clinic website</span></div><img src="../video/admin/shots-clean/07-site.png"></div>
    <div class="win admin"><div class="bar"><i></i><i></i><i></i><span>Staff admin panel</span></div><img src="../video/admin/shots-clean/04-notice.png"></div>
    <div class="phone"><div><img src="../video/cards/phone-1.png"></div></div>
    <div class="label" style="left:84px; top:14px">Patients book online · on any phone</div>
    <div class="label" style="right:60px; top:174px">Staff update hours &amp; notices</div>
  </div>
  <div class="foot">Demo clinic · fictional data</div>
</body>
</html>
